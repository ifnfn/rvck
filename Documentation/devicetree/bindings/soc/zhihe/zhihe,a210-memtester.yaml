%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/zhihe/zhihe,a210-memtester.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Zhihe A210 DDR Memory Tester

maintainers:
  - Zhiguo Zhu <zhiguo.zhu@linux.alibaba.com>

description:
  Hardware DDR memory tester found on the Zhihe A210 SoC. It performs
  DMA-based read/write pattern tests against DDR memory to verify
  memory integrity.

properties:
  compatible:
    const: zhihe,a210-memtester

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    memtester@30860000 {
        compatible = "zhihe,a210-memtester";
        reg = <0x30860000 0x1000>;
    };
