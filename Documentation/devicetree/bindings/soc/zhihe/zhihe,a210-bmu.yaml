%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/zhihe/zhihe,a210-bmu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Zhihe A210 Bus Monitor Unit (BMU)

maintainers:
  - Zhiguo Zhu <zhiguo.zhu@linux.alibaba.com>

description:
  Bus Monitor Unit (BMU) of the Zhihe A210 SoC. Each subsystem (DDR,
  GPU, NPU, PCIe, USB, VO, VI, VP, PERI) has its own BMU instance used
  for bus performance monitoring and tracing.

properties:
  compatible:
    enum:
      - zhihe,a210-ddr-bmu
      - zhihe,a210-gpu-bmu
      - zhihe,a210-npu-bmu
      - zhihe,a210-pcie-bmu
      - zhihe,a210-usb-bmu
      - zhihe,a210-vo-bmu
      - zhihe,a210-vi-bmu
      - zhihe,a210-vp-bmu
      - zhihe,a210-peri-bmu

  interrupts:
    minItems: 1
    maxItems: 4
    description:
      Per-channel BMU interrupts, two per monitored register group.

  zhihe,bm-num:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Number of monitored register groups (ports).

  zhihe,bm-name:
    $ref: /schemas/types.yaml#/definitions/string
    description: Name of this BMU instance.

required:
  - compatible
  - zhihe,bm-num
  - zhihe,bm-name

additionalProperties: false

examples:
  - |
    bmu-ddr {
        compatible = "zhihe,a210-ddr-bmu";
        interrupts = <100>, <101>;
        zhihe,bm-num = <2>;
        zhihe,bm-name = "bmu_ddr";
    };
