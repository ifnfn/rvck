%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/zhihe,a210-pinctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Zhihe A210 Pin Controller

maintainers:
  - Zhiguo Zhu <zhiguo.zhu@linux.alibaba.com>

description:
  Pin controller for the Zhihe A210 SoC. The A210 has several pad
  controller instances (AON, PADCTRL0-2), each identified by a group id
  and providing pin multiplexing and configuration for its pad group.

properties:
  compatible:
    const: zhihe,a210-pinctrl

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    items:
      - const: pclk

  zhihe,group-id:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Pad controller group index (0 = AON, 1-2 = PADCTRL1/2).

required:
  - compatible
  - reg
  - zhihe,group-id

additionalProperties: true

examples:
  - |
    pinctrl@30848000 {
        compatible = "zhihe,a210-pinctrl";
        reg = <0x30848000 0x2000>;
        clocks = <&aon_110m>;
        clock-names = "pclk";
        zhihe,group-id = <0>;
    };
