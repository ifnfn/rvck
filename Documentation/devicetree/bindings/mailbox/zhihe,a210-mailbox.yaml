%YAML 1.2
---
$id: http://devicetree.org/schemas/mailbox/zhihe,a210-mailbox.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Zhihe A210 Mailbox Controller

maintainers:
  - Zhiguo Zhu <zhiguo.zhu@linux.alibaba.com>

description:
  Mailbox controller for the Zhihe A210 SoC providing inter-processor
  communication channels between the application processor and other
  cores such as the AON (Always-On) subsystem.

properties:
  compatible:
    const: zhihe,a210-mailbox

  reg:
    minItems: 1
    maxItems: 8

  reg-names:
    minItems: 1
    maxItems: 8
    items:
      enum:
        - interrupt_addr
        - local_addr0
        - local_addr1
        - remote_icu0
        - remote_icu1

  clocks:
    minItems: 1
    maxItems: 2

  resets:
    minItems: 1
    maxItems: 2

  interrupts:
    maxItems: 1

  icu_cpu_id:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Local ICU CPU index for this mailbox instance.

  version:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Mailbox hardware version (1 = V1, 2 = V2).

  "#mbox-cells":
    const: 2

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - "#mbox-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    mailbox@321000 {
        compatible = "zhihe,a210-mailbox";
        reg = <0x00321000 0x1000>,
              <0x00320000 0x1000>,
              <0x00311000 0x1000>;
        reg-names = "interrupt_addr", "local_addr0", "remote_icu0";
        clocks = <&clk_peri 0>, <&clk_peri 1>;
        resets = <&rst 0>, <&rst 1>;
        interrupt-parent = <&intc>;
        interrupts = <336 IRQ_TYPE_LEVEL_HIGH>;
        icu_cpu_id = <0>;
        #mbox-cells = <2>;
        version = <1>;
    };
