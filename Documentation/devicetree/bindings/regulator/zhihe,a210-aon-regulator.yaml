%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/zhihe,a210-aon-regulator.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Zhihe A210 AON Regulator

maintainers:
  - Zhiguo Zhu <zhiguo.zhu@linux.alibaba.com>

description:
  Virtual regulator provider for the Zhihe A210 SoC. The regulators are
  physically controlled by the Always-On (AON) subsystem firmware and
  are accessed from the application processor over the AON mailbox.
  Each supported rail is described by a child node whose regulator-name
  identifies the corresponding AON virtual regulator.

properties:
  compatible:
    const: zhihe,a210-aon-regulator

patternProperties:
  ".*":
    type: object
    $ref: regulator.yaml#
    unevaluatedProperties: false

required:
  - compatible

additionalProperties: false

examples:
  - |
    regulators {
        compatible = "zhihe,a210-aon-regulator";

        dvdd_core {
            regulator-name = "dvdd_core";
            regulator-min-microvolt = <600000>;
            regulator-max-microvolt = <1000000>;
        };
    };
